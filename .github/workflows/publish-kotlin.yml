name: Publish Kotlin

# Tag the kotlin release as kotlin/vX.Y.Z (must match build.gradle.kts version).
# Requires the com.arpedon namespace to be verified on central.sonatype.com first.
on:
  push:
    tags: ["kotlin/v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kotlin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check tag matches gradle version
        run: |
          TAG="${GITHUB_REF_NAME#kotlin/v}"
          VER="$(grep -E '^version = ' build.gradle.kts | head -1 | sed -E 's/version = "(.*)"/\1/')"
          [ "$TAG" = "$VER" ] || { echo "tag $TAG != build.gradle.kts $VER"; exit 1; }

      - name: Publish to Maven Central
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache --stacktrace
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
