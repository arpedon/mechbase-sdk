name: Release Go

# Go has no registry — `go get` pulls straight from this repo via the module
# proxy. A subdir module must be tagged with the path prefix: go/vX.Y.Z.
# This workflow validates the tagged commit and publishes a GitHub Release.
on:
  push:
    tags: ["go/v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build, vet & test
        run: |
          go build ./...
          go vet ./...
          go test ./...

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Go $GITHUB_REF_NAME" \
            --notes "go get github.com/arpedon/mechbase-sdk/go@${GITHUB_REF_NAME#go/}"
