[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mechbase"
version = "0.2.0"
description = "Official Python client for the Mechbase condition-monitoring API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Arpedon" }]
urls = { Homepage = "https://app.mechbase.io", Source = "https://github.com/arpedon/mechbase-sdk" }
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "respx>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mechbase"]
