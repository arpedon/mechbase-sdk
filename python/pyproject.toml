[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mechbase"
version = "0.2.0"
description = "Official Python client for the Mechbase condition-monitoring API"
readme = "../README.md"
requires-python = ">=3.10"
license = { file = "../LICENSE" }
authors = [{ name = "Arpedon" }]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "respx>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mechbase"]
